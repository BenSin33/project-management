name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - ThienQuy
  pull_request:
    branches:
      - main
      - master
      - ThienQuy
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend CI (React + Vite + Vitest)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cinema-Booking-System-main/source-code/galaxy-cinema-hub-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Cinema-Booking-System-main/source-code/galaxy-cinema-hub-main/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run Unit Tests (Vitest)
        run: |
          npm test

      - name: Build production bundle (Vite)
        run: |
          npm run build

      - name: Run Linter (ESLint)
        run: |
          npm run lint
        continue-on-error: true

  # -------------------------------------------------------------
  # Job 2: Backend CI (PHP + MySQL + API Smoke Tests)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (PHP 8.2 + MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cinema-Booking-System-main

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "12345678"
          MYSQL_DATABASE: "galaxy_cinema"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, mbstring, json, curl
          coverage: none

      - name: Validate PHP Syntax (Lint)
        run: |
          echo "Scanning PHP syntax..."
          find backend scripts -type f -name "*.php" -print0 | xargs -0 -n 1 php -l

      - name: Initialize Database Schema & Seed Data
        run: |
          echo "Importing schema..."
          mysql -h 127.0.0.1 -P 3306 -u root -p12345678 galaxy_cinema < backend/database/schema.sql
          echo "Importing seed data..."
          mysql -h 127.0.0.1 -P 3306 -u root -p12345678 galaxy_cinema < backend/database/seed_data.sql

      - name: Setup Backend Environment (.env)
        run: |
          cat << 'EOF' > backend/.env
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=galaxy_cinema
          DB_USERNAME=root
          DB_PASSWORD=12345678
          JWT_SECRET=galaxy_cinema_secret_key_2026_change_this_in_production
          JWT_EXPIRATION=86400
          SMTP_ENABLED=false
          APP_NAME="Galaxy Cinema CI"
          TIMEZONE=Asia/Ho_Chi_Minh
          EOF

      - name: Start PHP Built-in Server
        run: |
          php -S 127.0.0.1:8000 -t backend backend/index.php > php_server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 3

      - name: Run API Smoke Test
        run: |
          API_BASE_URL=http://127.0.0.1:8000 php scripts/test_api.php

      - name: Output Server Logs on Failure
        if: always()
        run: |
          if [ -f php_server.log ]; then
            echo "=== PHP Server Log Output ==="
            cat php_server.log
          fi

  # -------------------------------------------------------------
  # Job 3: Docker Compose & Image Validation
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cinema-Booking-System-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker.yml config

      - name: Build PHP App Docker Image
        run: |
          docker build -t galaxy-cinema-app:ci -f docker/php/Dockerfile .
